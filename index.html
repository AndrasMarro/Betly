<!doctype html>
<html lang="de" data-theme="noir">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Betly: Roulette, Blackjack, Poker, Slots und Arcade-Games mit simuliertem Spielgeld. Kein Echtgeld." />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Betly" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Betly · Spielgeld-Casino</title>
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('betly:settings') || '{}');
        document.documentElement.dataset.theme = s.theme || 'noir';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
